<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuoteRecover — Lead Recovery</title><style>:root{--ink:#17202a;--muted:#64748b;--brand:#0b6b57;--bg:#f6f8f7;--card:#fff;--danger:#b42318;--warn:#a15c00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}main{max-width:1180px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}h1{margin:0;font-size:28px}h2{margin:0 0 14px}button{border:0;border-radius:9px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#e7eeeb;color:var(--brand)}button.danger{background:#fee4e2;color:var(--danger)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--card);border:1px solid #e3e9e6;border-radius:14px;padding:16px}.metric b{display:block;font-size:25px;margin-top:4px}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{flex:1;min-width:180px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd6d1;border-radius:8px;font:inherit;background:#fff}label{display:block;font-weight:650;margin:10px 0 5px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #edf0ef;padding:11px 7px;vertical-align:top}.table th{color:var(--muted);font-size:12px;text-transform:uppercase}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#e7eeeb;color:var(--brand);font-size:12px;font-weight:700}.overdue{color:var(--danger);font-weight:700}.due{color:var(--warn);font-weight:700}.modal{position:fixed;inset:0;background:#17202a66;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal>section{background:#fff;max-width:650px;width:100%;max-height:92vh;overflow:auto;border-radius:16px;padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.table th:nth-child(3),.table td:nth-child(3){display:none}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}header{align-items:flex-start;flex-direction:column}}
</style></head><body><main><header><div><div class="muted">QUOTERECOVER SG</div><h1>Lead recovery workspace</h1></div><div><button id="add">+ Add enquiry</button> <button class="secondary" id="export">Export CSV</button></div></header><section class="grid" id="metrics"></section><section class="panel" style="margin-top:18px"><div class="toolbar"><input id="search" placeholder="Search customer, service, location…"><select id="filter"><option value="">All statuses</option><option>New</option><option>Contacted</option><option>Quote Sent</option><option>Negotiating</option><option>Won</option><option>Lost</option><option>On Hold</option></select><button class="secondary" id="backup">Backup JSON</button><button class="secondary" id="restoreBtn">Restore</button><input id="restore" type="file" accept="application/json" hidden></div><table class="table"><thead><tr><th>Customer</th><th>Service</th><th>Quote</th><th>Status</th><th>Next follow-up</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></main><div class="modal" id="modal"><section><h2 id="modalTitle">Add enquiry</h2><form id="form"><input id="editId" type="hidden"><div class="formgrid"><div><label>Customer name *</label><input id="name" required></div><div><label>Phone *</label><input id="phone" required></div><div><label>Service *</label><input id="service" placeholder="Renovation, plumbing…" required></div><div><label>Location</label><input id="location"></div><div><label>Quote amount (SGD)</label><input id="quote" type="number" min="0" step="0.01"></div><div><label>Status</label><select id="status"><option>New</option><option>Contacted</option><option>Quote Sent</option><option>Negotiating</option><option>Won</option><option>Lost</option><option>On Hold</option></select></div><div><label>Next action</label><input id="action" placeholder="Follow up on quote"></div><div><label>Follow-up date</label><input id="date" type="date"></div><div class="full"><label>Notes</label><textarea id="notes" rows="3"></textarea></div></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button>Save enquiry</button></div></form></section></div><script>
const KEY='quoterecover_product_v1';let leads=JSON.parse(localStorage.getItem(KEY)||'[]');const $=id=>document.getElementById(id);const today=()=>new Date().toISOString().slice(0,10);const save=()=>{localStorage.setItem(KEY,JSON.stringify(leads));render()};const money=n=>n?new Intl.NumberFormat('en-SG',{style:'currency',currency:'SGD',maximumFractionDigits:0}).format(n):'—';
function render(){let q=($('search').value||'').toLowerCase(),f=$('filter').value;let active=leads.filter(x=>!['Won','Lost'].includes(x.status));let overdue=active.filter(x=>x.date&&x.date<today()).length,due=active.filter(x=>x.date===today()).length,open=active.reduce((s,x)=>s+(+x.quote||0),0),won=leads.filter(x=>x.status==='Won').length;$('metrics').innerHTML=[['Active enquiries',active.length],['Follow-ups due today',due],['Overdue follow-ups',overdue],['Open quote value',money(open)]].map(x=>`<div class="card metric"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');let list=leads.filter(x=>(!f||x.status===f)&&(!q||[x.name,x.phone,x.service,x.location,x.notes].join(' ').toLowerCase().includes(q)));$('rows').innerHTML=list.length?list.map(x=>{let cls=x.date&&x.date<today()&&!['Won','Lost'].includes(x.status)?'overdue':x.date===today()?'due':'';return `<tr><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.phone)}</span></td><td>${esc(x.service)}<br><span class="muted">${esc(x.location||'')}</span></td><td>${money(x.quote)}</td><td><span class="status">${x.status}</span></td><td class="${cls}">${x.date||'No date'}<br><span class="muted">${esc(x.action||'No next action')}</span></td><td><button class="secondary" onclick="edit('${x.id}')">Edit</button></td></tr>`}).join(''):'<tr><td colspan="6" class="muted">No enquiries yet. Add your first lead above.</td></tr>'};function esc(v=''){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function edit(id){let x=leads.find(a=>a.id===id);$('modalTitle').textContent='Edit enquiry';$('editId').value=id;['name','phone','service','location','quote','status','action','date','notes'].forEach(k=>$(k).value=x[k]??'');$('modal').classList.add('open')}function openNew(){$('modalTitle').textContent='Add enquiry';$('form').reset();$('editId').value='';$('date').value=today();$('modal').classList.add('open')}$('add').onclick=openNew;$('cancel').onclick=()=>$('modal').classList.remove('open');$('search').oninput=render;$('filter').onchange=render;$('form').onsubmit=e=>{e.preventDefault();let id=$('editId').value||crypto.randomUUID();let old=leads.find(x=>x.id===id)||{};let x={...old,id,name:$('name').value.trim(),phone:$('phone').value.trim(),service:$('service').value.trim(),location:$('location').value.trim(),quote:+$('quote').value||0,status:$('status').value,action:$('action').value.trim(),date:$('date').value,notes:$('notes').value.trim(),updatedAt:new Date().toISOString(),createdAt:old.createdAt||new Date().toISOString()};let i=leads.findIndex(a=>a.id===id);i<0?leads.unshift(x):leads[i]=x;save();$('modal').classList.remove('open')};$('backup').onclick=()=>download('quoterecover-backup.json',JSON.stringify(leads,null,2),'application/json');$('restoreBtn').onclick=()=>$('restore').click();$('restore').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw Error();if(confirm('Replace current data?')){leads=x;save()}}catch{alert('Invalid backup file')}};r.readAsText(e.target.files[0])};function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}$('export').onclick=()=>{let head='name,phone,service,location,quote,status,next_action,follow_up_date,notes\n';let csv=head+leads.map(x=>[x.name,x.phone,x.service,x.location,x.quote,x.status,x.action,x.date,x.notes].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\n');download('quoterecover-leads.csv',csv,'text/csv')};render();</script></body></html>
