<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TenderBrief — Workspace</title><style>:root{--ink:#182034;--muted:#667085;--brand:#3b4db8;--bg:#f7f8fc;--card:#fff;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}h1{margin:0;font-size:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--card);border:1px solid #e7e9f2;border-radius:14px;padding:16px}.metric b{display:block;font-size:25px}.muted{color:var(--muted)}button{border:0;border-radius:9px;padding:10px 14px;background:var(--brand);color:white;font-weight:700;cursor:pointer}button.secondary{background:#e9ebfa;color:var(--brand)}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd2e8;border-radius:8px;font:inherit;background:white}label{display:block;font-weight:650;margin:10px 0 5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{flex:1;min-width:160px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 7px;border-bottom:1px solid #edf0f6;text-align:left;vertical-align:top}.table th{font-size:12px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#e9ebfa;color:var(--brand);font-size:12px;font-weight:700}.soon{color:#a15c00;font-weight:700}.late{color:var(--red);font-weight:700}.modal{position:fixed;inset:0;background:#18203466;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal>section{background:white;padding:20px;border-radius:16px;max-width:700px;width:100%;max-height:92vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.table th:nth-child(2),.table td:nth-child(2){display:none}}
</style></head><body><main><header><div><div class="muted">TENDERBRIEF SG · CLEANING & FACILITIES</div><h1>Tender intelligence workspace</h1></div><div><button id="add">+ Add tender</button> <button class="secondary" id="digest">Build digest</button></div></header><section class="grid" id="metrics"></section><section class="panel" style="margin-top:18px"><div class="toolbar"><input id="search" placeholder="Search title, buyer, reference…"><select id="decision"><option value="">All decisions</option><option>Unreviewed</option><option>Bid</option><option>No-bid</option><option>Hold</option><option>Submitted</option><option>Won</option><option>Lost</option></select><button class="secondary" id="backup">Backup JSON</button><button class="secondary" id="export">Export CSV</button></div><table class="table"><thead><tr><th>Tender</th><th>Buyer</th><th>Closing</th><th>Fit</th><th>Decision</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></main><div class="modal" id="modal"><section><h2 id="title">Add tender</h2><form id="form"><input id="id" type="hidden"><div class="formgrid"><div class="full"><label>Title *</label><input id="name" required></div><div><label>Procuring entity *</label><input id="buyer" required></div><div><label>GeBIZ reference *</label><input id="ref" required></div><div><label>Official URL *</label><input id="url" type="url" placeholder="https://www.gebiz.gov.sg/…" required></div><div><label>Closing date *</label><input id="date" type="date" required></div><div><label>Service category</label><input id="category" value="Commercial cleaning"></div><div><label>Fit score (0–100)</label><input id="fit" type="number" min="0" max="100" value="50"></div><div><label>Decision</label><select id="state"><option>Unreviewed</option><option>Bid</option><option>No-bid</option><option>Hold</option><option>Submitted</option><option>Won</option><option>Lost</option></select></div><div class="full"><label>Plain-English summary</label><textarea id="summary" rows="3"></textarea></div><div class="full"><label>Why it matters / internal notes</label><textarea id="notes" rows="3"></textarea></div></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button>Save tender</button></div></form></section></div><script>
const KEY='tenderbrief_product_v1';let tenders=JSON.parse(localStorage.getItem(KEY)||'[]');const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),save=()=>{localStorage.setItem(KEY,JSON.stringify(tenders));render()};const days=x=>Math.ceil((new Date(x)-new Date(today()))/86400000);const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let q=($('search').value||'').toLowerCase(),d=$('decision').value;let list=tenders.filter(x=>(!d||x.state===d)&&(!q||[x.name,x.buyer,x.ref,x.category,x.summary].join(' ').toLowerCase().includes(q)));let active=tenders.filter(x=>x.date>=today()),soon=active.filter(x=>days(x.date)<=7).length,high=active.filter(x=>(+x.fit||0)>=80).length,review=active.filter(x=>x.state==='Unreviewed').length;$('metrics').innerHTML=[['Active tenders',active.length],['Closing within 7 days',soon],['High-fit tenders',high],['Awaiting decision',review]].map(x=>`<div class="card metric"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');$('rows').innerHTML=list.length?list.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>{let n=days(x.date),cl=n<0?'late':n<=7?'soon':'';return `<tr><td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.ref)} · ${esc(x.category)}</span></td><td>${esc(x.buyer)}</td><td class="${cl}">${x.date}<br><span class="muted">${n<0?'Closed':n+' days left'}</span></td><td><span class="badge">${x.fit||0}/100</span></td><td>${esc(x.state)}</td><td><button class="secondary" onclick="edit('${x.id}')">Edit</button></td></tr>`}).join(''):'<tr><td colspan="6" class="muted">No tenders yet. Add one from GeBIZ to begin.</td></tr>'}function openNew(){$('title').textContent='Add tender';$('form').reset();$('id').value='';$('category').value='Commercial cleaning';$('fit').value=50;$('modal').classList.add('open')}function edit(id){let x=tenders.find(a=>a.id===id);$('title').textContent='Edit tender';$('id').value=x.id;[['name','name'],['buyer','buyer'],['ref','ref'],['url','url'],['date','date'],['category','category'],['fit','fit'],['state','state'],['summary','summary'],['notes','notes']].forEach(([a,b])=>$(a).value=x[b]??'');$('modal').classList.add('open')}$('add').onclick=openNew;$('cancel').onclick=()=>$('modal').classList.remove('open');$('search').oninput=render;$('decision').onchange=render;$('form').onsubmit=e=>{e.preventDefault();let id=$('id').value||crypto.randomUUID(),old=tenders.find(x=>x.id===id)||{};let x={...old,id,name:$('name').value.trim(),buyer:$('buyer').value.trim(),ref:$('ref').value.trim(),url:$('url').value.trim(),date:$('date').value,category:$('category').value.trim(),fit:Math.min(100,Math.max(0,+$('fit').value||0)),state:$('state').value,summary:$('summary').value.trim(),notes:$('notes').value.trim(),updatedAt:new Date().toISOString(),createdAt:old.createdAt||new Date().toISOString()};let dup=tenders.find(a=>a.ref===x.ref&&a.id!==id);if(dup&&!confirm('This GeBIZ reference already exists. Save anyway?'))return;let i=tenders.findIndex(a=>a.id===id);i<0?tenders.unshift(x):tenders[i]=x;save();$('modal').classList.remove('open')};function download(n,d,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click()}$('backup').onclick=()=>download('tenderbrief-backup.json',JSON.stringify(tenders,null,2),'application/json');$('export').onclick=()=>{let h='title,buyer,gebiz_reference,official_url,closing_date,category,fit_score,decision,summary,notes\n';let c=h+tenders.map(x=>[x.name,x.buyer,x.ref,x.url,x.date,x.category,x.fit,x.state,x.summary,x.notes].map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',')).join('\n');download('tenderbrief.csv',c,'text/csv')};$('digest').onclick=()=>{let chosen=tenders.filter(x=>x.date>=today()&&x.fit>=60).sort((a,b)=>a.date.localeCompare(b.date));let text='# TenderBrief SG\n\nSelected opportunities from GeBIZ. Verify every detail on the official listing.\n\n'+(chosen.length?chosen.map((x,i)=>`## ${i+1}. ${x.name}\n- Buyer: ${x.buyer}\n- Closing: ${x.date}\n- Fit: ${x.fit}/100\n- Summary: ${x.summary||'Review official listing'}\n- Official link: ${x.url}`).join('\n\n'):'No eligible tenders yet. Add records with fit score 60+ and future closing dates.');download('tenderbrief-digest.md',text,'text/markdown')};render();</script></body></html>
