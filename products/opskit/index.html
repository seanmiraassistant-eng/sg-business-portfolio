<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsKit — Weekly Operations</title><style>:root{--ink:#17202a;--muted:#64748b;--brand:#b34a20;--bg:#fff9f5;--card:#fff;--line:#eee2da}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:22px}h1{margin:0;font-size:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.metric b{display:block;font-size:25px}.muted{color:var(--muted)}button{border:0;border-radius:9px;padding:10px 14px;background:var(--brand);color:white;font-weight:700;cursor:pointer}button.secondary{background:#fae9df;color:var(--brand)}button.danger{background:#fee4e2;color:#b42318}input,select,textarea{width:100%;padding:10px;border:1px solid #e3d2c7;border-radius:8px;font:inherit;background:white}label{display:block;font-weight:650;margin:10px 0 5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select{flex:1;min-width:170px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #f1e8e2;padding:11px 7px;vertical-align:top}.table th{color:var(--muted);font-size:12px;text-transform:uppercase}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#fae9df;color:var(--brand);font-size:12px;font-weight:700}.late{color:#b42318;font-weight:700}.modal{position:fixed;inset:0;background:#17202a66;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal>section{background:#fff;max-width:650px;width:100%;max-height:92vh;overflow:auto;border-radius:16px;padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.table th:nth-child(2),.table td:nth-child(2){display:none}}
</style></head><body><main><header><div><div class="muted">OPSKIT SG · SERVICE BUSINESS</div><h1>Weekly operations dashboard</h1></div><div><button id="add">+ Add task</button> <button class="secondary" id="backup">Backup JSON</button></div></header><section class="grid" id="metrics"></section><section class="panel" style="margin-top:18px"><div class="toolbar"><input id="search" placeholder="Search task, customer, address…"><select id="statusFilter"><option value="">All statuses</option><option>Backlog</option><option>Scheduled</option><option>In progress</option><option>Waiting</option><option>Completed</option><option>Cancelled</option></select><select id="priorityFilter"><option value="">All priorities</option><option>Urgent</option><option>High</option><option>Normal</option><option>Low</option></select><button class="secondary" id="restoreBtn">Restore</button><input id="restore" type="file" accept="application/json" hidden></div><table class="table"><thead><tr><th>Task</th><th>Customer / site</th><th>Due</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></main><div class="modal" id="modal"><section><h2>Add task</h2><form id="form"><input id="id" type="hidden"><div class="formgrid"><div class="full"><label>Task title *</label><input id="task" required placeholder="Service air-conditioner"></div><div><label>Customer</label><input id="customer"></div><div><label>Site/address</label><input id="site"></div><div><label>Due date</label><input id="due" type="date"></div><div><label>Priority</label><select id="priority"><option>Normal</option><option>Urgent</option><option>High</option><option>Low</option></select></div><div><label>Status</label><select id="state"><option>Backlog</option><option>Scheduled</option><option>In progress</option><option>Waiting</option><option>Completed</option><option>Cancelled</option></select></div><div class="full"><label>Notes</label><textarea id="notes" rows="3"></textarea></div></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button>Save task</button></div></form></section></div><script>
const KEY='opskit_product_v1';let tasks=JSON.parse(localStorage.getItem(KEY)||'[]');const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),save=()=>{localStorage.setItem(KEY,JSON.stringify(tasks));render()},esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let q=($('search').value||'').toLowerCase(),sf=$('statusFilter').value,pf=$('priorityFilter').value;let active=tasks.filter(x=>!['Completed','Cancelled'].includes(x.state)),overdue=active.filter(x=>x.due&&x.due<today()).length,todayN=active.filter(x=>x.due===today()).length,week=active.filter(x=>x.due&&x.due>=today()&&x.due<=new Date(Date.now()+7*864e5).toISOString().slice(0,10)).length,done=tasks.filter(x=>x.state==='Completed').length;$('metrics').innerHTML=[['Open tasks',active.length],['Due today',todayN],['Overdue',overdue],['Completed total',done]].map(x=>`<div class="card metric"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');let list=tasks.filter(x=>(!sf||x.state===sf)&&(!pf||x.priority===pf)&&(!q||[x.task,x.customer,x.site,x.notes].join(' ').toLowerCase().includes(q)));$('rows').innerHTML=list.length?list.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).map(x=>`<tr><td><b>${esc(x.task)}</b><br><span class="muted">${esc(x.notes||'')}</span></td><td>${esc(x.customer||'—')}<br><span class="muted">${esc(x.site||'')}</span></td><td class="${x.due&&x.due<today()&&!['Completed','Cancelled'].includes(x.state)?'late':''}">${x.due||'No date'}</td><td><span class="badge">${x.priority}</span></td><td>${x.state}</td><td><button class="secondary" onclick="edit('${x.id}')">Edit</button></td></tr>`).join(''):'<tr><td colspan="6" class="muted">No tasks yet. Add the first job or follow-up.</td></tr>'}function openNew(){$('form').reset();$('id').value='';$('due').value=today();$('modal').classList.add('open')}function edit(id){let x=tasks.find(a=>a.id===id);$('id').value=x.id;[['task','task'],['customer','customer'],['site','site'],['due','due'],['priority','priority'],['state','state'],['notes','notes']].forEach(([a,b])=>$(a).value=x[b]??'');$('modal').classList.add('open')}$('add').onclick=openNew;$('cancel').onclick=()=>$('modal').classList.remove('open');$('search').oninput=render;$('statusFilter').onchange=render;$('priorityFilter').onchange=render;$('form').onsubmit=e=>{e.preventDefault();let id=$('id').value||crypto.randomUUID(),old=tasks.find(x=>x.id===id)||{};let state=$('state').value;let x={...old,id,task:$('task').value.trim(),customer:$('customer').value.trim(),site:$('site').value.trim(),due:$('due').value,priority:$('priority').value,state,notes:$('notes').value.trim(),completedAt:state==='Completed'?(old.completedAt||new Date().toISOString()):null,updatedAt:new Date().toISOString(),createdAt:old.createdAt||new Date().toISOString()};let i=tasks.findIndex(a=>a.id===id);i<0?tasks.unshift(x):tasks[i]=x;save();$('modal').classList.remove('open')};function download(n,d,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:t}));a.download=n;a.click()}$('backup').onclick=()=>download('opskit-backup.json',JSON.stringify(tasks,null,2),'application/json');$('restoreBtn').onclick=()=>$('restore').click();$('restore').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw Error();if(confirm('Replace current tasks?')){tasks=x;save()}}catch{alert('Invalid backup file')}};r.readAsText(e.target.files[0])};render();</script></body></html>
